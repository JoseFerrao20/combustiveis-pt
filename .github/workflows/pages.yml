name: Painel

# Descarrega o boletim, corre o dbt e publica o painel (dashboard/) no GitHub Pages. Em
# Settings → Pages, a origem tem de ser "GitHub Actions".
#
# Corre a cada push na main e duas vezes por semana (terça e quinta, de manhã em UTC): o
# boletim traz os preços de segunda e sai nos dias seguintes. Uma execução agendada que falhe
# chega por email a quem mudou o cron por último. O GitHub desliga os agendamentos de um
# repositório público sem atividade há 60 dias; volta-se a ligá-los em Actions → Painel.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 5 * * 2,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --locked --all-groups
      # Falha se o boletim não tiver uma semana dos últimos 15 dias (falta mais de uma
      # publicação): é a forma de dar conta de uma fonte parada ou de um link que mudou.
      - run: uv run combustiveis ingest --idade-maxima 15
      - run: uv run dbt build --project-dir transform --profiles-dir transform
      - name: Painel (Evidence)
        working-directory: dashboard
        run: |
          npm ci
          npm run sources:strict
          npm run build:strict
      # O GitHub Pages serve o artefacto em /combustiveis-pt/, o deployment.basePath do
      # evidence.config.yaml: os ficheiros vão na raiz do artefacto.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
