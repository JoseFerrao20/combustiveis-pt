name: Painel

# Descarrega o boletim, corre o dbt e publica o painel (dashboard/) no GitHub Pages. Em
# Settings → Pages, a origem tem de ser "GitHub Actions".
#
# Corre a cada push na main, logo a seguir à fotografia semanal da DGEG (dgeg.yml, às
# segundas) e todos os dias de manhã (UTC): o boletim europeu sai uma vez por semana e as
# cotações da previsão mudam todos os dias úteis. Os preços dos postos são os da última
# fotografia do ramo dados (o build não lê a DGEG). Uma execução agendada que falhe chega por
# email a quem mudou o cron por último. O GitHub desliga os agendamentos de um repositório
# público sem atividade há 60 dias; volta-se a ligá-los em Actions → Painel.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 5 * * *"
  workflow_run:
    workflows: ["Fotografia DGEG"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --locked --all-groups
      # Falha se o boletim não tiver uma semana dos últimos 15 dias (falta mais de uma
      # publicação): é a forma de dar conta de uma fonte parada ou de um link que mudou.
      - run: uv run combustiveis ingest --idade-maxima 15
      # As cotações da gasolina e do gasóleo em Nova Iorque e o câmbio (FRED), para a previsão
      # de segunda-feira.
      - run: uv run combustiveis mercados
      # As fotografias da DGEG (uma por semana, à segunda-feira) estão no ramo dados (dgeg.yml).
      # O build não pede nada à DGEG: os preços do site são os da última fotografia. Sem
      # nenhuma fotografia, o passo falha.
      - name: Fotografias da DGEG
        run: |
          mkdir -p data/landing
          git fetch --depth=1 origin dados
          git archive FETCH_HEAD dgeg | tar -x -C data/landing
          ls data/landing/dgeg/*.parquet
      - run: uv run dbt build --project-dir transform --profiles-dir transform
      # Os JSON da página inicial (dashboard/app/), a partir dos Parquet do dbt.
      - run: uv run combustiveis site
      - name: Painel (Evidence e página inicial)
        working-directory: dashboard
        run: |
          npm ci
          npm run sources:strict
          npm run build:strict
      # O GitHub Pages serve o artefacto em /combustiveis-pt/, o deployment.basePath do
      # evidence.config.yaml: os ficheiros vão na raiz do artefacto.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/build

  # A DGEG só mostra o preço em vigor: um dia sem fotografia não se recupera. Este trabalho
  # falha (com email) se a última fotografia do ramo dados tiver mais de 2 dias, por exemplo
  # porque o dgeg.yml deixou de correr. Fica à parte do build, para o site continuar a ser
  # publicado.
  vigilancia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Histórico da DGEG em dia
        run: |
          mkdir -p data/landing
          git fetch --depth=1 origin dados
          git archive FETCH_HEAD dgeg | tar -x -C data/landing
          uv run combustiveis verificar-dgeg --idade-maxima 8

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Depois de publicar, abre o site como um visitante: a página inicial, os preços de uma
  # fotografia recente (no máximo 8 dias) com postos, uma página do Evidence, o service worker e
  # o manifesto. Se falhar, o GitHub manda um email com todos os problemas (o site já está
  # publicado; a falha é um aviso para ir ver).
  verificar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run combustiveis verificar-site --url "${{ needs.deploy.outputs.url }}"
