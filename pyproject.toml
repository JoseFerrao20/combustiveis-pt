[project]
name = "combustiveis"
version = "0.1.0"
description = "Preços dos combustíveis em Portugal e na UE: o que é produto e o que é imposto, desde 2005."
readme = "README.md"
license = "MIT"
authors = [{ name = "José Ferrão" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "openpyxl>=3.1",
]

[project.scripts]
combustiveis = "combustiveis.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]  # asserts e SQL com caminhos temporários dos testes

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=combustiveis --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
