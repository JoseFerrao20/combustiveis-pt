models:
  - name: rpt_road_fuel_prices
    description: >
      Gasolina 95, gasóleo e GPL em euros por litro, para o painel (dashboard/). É exportada
      para Parquet (EXPORT_PATH, por omissão data/road_fuel_prices.parquet) porque o Evidence
      traz um DuckDB mais antigo, que não abre a base de dados do dbt.
    data_tests:
      - unique_combination:
          arguments:
            columns: [week, country_code, product]
    columns:
      - name: price
        description: Preço com impostos, em € por litro.
        data_tests:
          - not_null
      - name: tax_share
        data_tests:
          - not_null
  - name: rpt_stations_latest
    description: >
      A última fotografia da DGEG (um posto por linha e combustível do painel), exportada para
      Parquet (STATIONS_EXPORT_PATH, por omissão data/stations_latest.parquet).
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, fuel]
  - name: rpt_station_prices_daily
    description: >
      Preço médio, mediano, mínimo e máximo por dia e combustível: no país, por grupo de marcas,
      por marca e por distrito (coluna `dimension`). Exportado para Parquet
      (STATIONS_DAILY_EXPORT_PATH, por omissão data/station_prices_daily.parquet).
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, fuel, dimension, label]
  - name: rpt_tracked_stations_daily
    description: >
      Os postos acompanhados (seed tracked_stations), por dia e combustível: o preço, a média e
      o mínimo dos concorrentes a 5 km, a posição entre eles (`rank_5km`, 1 = o mais barato) e
      a média do concelho. Exportado para Parquet (TRACKED_DAILY_EXPORT_PATH, por omissão
      data/tracked_stations_daily.parquet).
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, station_id, fuel]
    columns:
      - name: rank_5km
        data_tests: [not_null]
  - name: rpt_tracked_station_competitors
    description: >
      Os concorrentes a 5 km dos postos acompanhados na última fotografia, um por linha e
      combustível, com a distância. Exportado para Parquet (TRACKED_COMPETITORS_EXPORT_PATH, por
      omissão data/tracked_station_competitors.parquet).
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, competitor_id, fuel]
  - name: rpt_price_forecast
    description: >
      A previsão de segunda-feira para as semanas depois do ajuste dos coeficientes (o período de
      teste) e para a próxima, exportada para Parquet (FORECAST_EXPORT_PATH, por omissão
      data/price_forecast.parquet).
    data_tests:
      - unique_combination:
          arguments:
            columns: [target_week, product]
