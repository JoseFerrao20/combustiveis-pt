version: 2

models:
  - name: stg_bulletin__prices
    columns:
      - name: tax_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["with_tax", "without_tax"]
      - name: price
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [week, country_code, product, tax_status]
  - name: stg_bulletin__taxes
    columns:
      - name: tax
        data_tests:
          - accepted_values:
              arguments:
                values: ["vat", "excise", "other"]
    data_tests:
      - unique_combination:
          arguments:
            columns: [tax, country_code, product, valid_from]

  - name: stg_ilhas__max_prices
    description: Os preços máximos das regiões autónomas, um por região, combustível e data.
    data_tests:
      - unique_combination:
          arguments:
            columns: [region, fuel, valid_from]
    columns:
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['acores', 'madeira']
      - name: fuel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gasolina_95', 'gasoleo']
      - name: price
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null
