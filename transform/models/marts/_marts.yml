version: 2

models:
  - name: fct_fuel_prices
    description: >
      Preço de cada semana, país e produto (euros por 1000 L, ou por tonelada nos fuelóleos),
      com a parte que é imposto. A decomposição em IVA e em "ISP e outros impostos" usa só os
      preços publicados e a taxa do IVA, e soma sempre o preço. `tax_tables_gap` é o que as
      tabelas de ISP e de outros impostos do boletim não explicam (só para países no euro).
    columns:
      - name: week
        description: Segunda-feira da semana do boletim.
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('countries')
                field: country_code
      - name: product
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product
      - name: tax_share
        description: Parte do preço que é imposto (0 a 1).
      - name: tax_tables_gap
        description: >
          ISP e outros impostos calculados a partir dos preços, menos os das tabelas do
          boletim. Perto de zero quando as tabelas estão certas.
      - name: tax_tables_issue
        description: >
          Quando já se sabe porque é que as tabelas não explicam o preço nessa semana, a
          explicação (seed known_tax_table_issues).
    data_tests:
      - unique_combination:
          arguments:
            columns: [week, country_code, product]

  - name: fct_station_prices
    description: >
      Preço de cada posto de Portugal continental (DGEG), por dia de fotografia e combustível, em
      euros por litro com impostos. O histórico começa no dia da primeira fotografia (a DGEG só
      mostra o preço em vigor).
    columns:
      - name: fuel
        data_tests:
          - relationships:
              arguments:
                to: ref('dgeg_fuels')
                field: fuel
      - name: price
        data_tests: [not_null]
      - name: is_current
        description: O preço foi atualizado nos 30 dias antes da fotografia.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, station_id, fuel]

  - name: fct_price_forecasts
    description: >
      A previsão da mudança do preço em Portugal a cada segunda-feira (euros por litro, com IVA,
      sem mudanças do ISP), a partir das cotações em Nova Iorque das duas semanas antes e dos
      coeficientes do seed forecast_coefficients, ao lado da mudança que o boletim publicou.
    data_tests:
      - unique_combination:
          arguments:
            columns: [target_week, product]

unit_tests:
  - name: decomposes_the_portuguese_price
    description: Gasolina 95 em Portugal, semana de 19/10/2026, com os valores reais do boletim.
    model: fct_fuel_prices
    given:
      - input: ref('int_prices_pivoted')
        rows:
          - {week: 2026-10-19, country_code: PT, product: euro95, price_with_tax: 2099.0, price_without_tax: 1121.7762830536503}
      - input: ref('int_taxes_in_force')
        rows:
          - {week: 2026-10-19, country_code: PT, product: euro95, vat_rate: 23, excise: 425.62, other_taxes: 159.11}
      - input: ref('countries')
        rows:
          - {country_code: PT, name: Portugal, kind: country, euro_since: 2002-01-01}
      - input: ref('known_tax_table_issues')
        format: csv
        rows: |
          country_code,product,valid_from,valid_to,description
    expect:
      rows:
        # 2099 ÷ 1,23 = 1706,50 sem IVA; 1706,50 − 1121,78 = 584,73 de ISP e outros impostos, e as
        # tabelas do boletim (425,62 + 159,11) explicam-nos a menos de um cêntimo por 1000 L.
        - {country_code: PT, vat_amount: 392.4959349593496, excise_and_other_taxes: 584.7277819870001, tax_tables_gap: -0.00221801299994695}
  - name: decomposition_adds_up_to_the_price
    description: Números redondos, para se ver a conta (IVA a 25 %).
    model: fct_fuel_prices
    given:
      - input: ref('int_prices_pivoted')
        rows:
          - {week: 2026-01-05, country_code: ES, product: diesel, price_with_tax: 125.0, price_without_tax: 60.0}
      - input: ref('int_taxes_in_force')
        rows:
          - {week: 2026-01-05, country_code: ES, product: diesel, vat_rate: 25, excise: 30.0, other_taxes: 5.0}
      - input: ref('countries')
        rows:
          - {country_code: ES, name: Espanha, kind: country, euro_since: 2002-01-01}
      - input: ref('known_tax_table_issues')
        format: csv
        rows: |
          country_code,product,valid_from,valid_to,description
    expect:
      rows:
        - {taxes_total: 65.0, vat_amount: 25.0, excise_and_other_taxes: 40.0, tax_tables_gap: 5.0, tax_share: 0.52}
  - name: taxes_in_national_currency_are_not_compared
    description: Antes do euro, o ISP vinha em moeda nacional e não se subtrai a preços em euros.
    model: fct_fuel_prices
    given:
      - input: ref('int_prices_pivoted')
        rows:
          - {week: 2014-06-02, country_code: HR, product: diesel, price_with_tax: 1400.0, price_without_tax: 800.0}
      - input: ref('int_taxes_in_force')
        rows:
          - {week: 2014-06-02, country_code: HR, product: diesel, vat_rate: 25, excise: 3060.0, other_taxes: 0}
      - input: ref('countries')
        rows:
          - {country_code: HR, name: Croácia, kind: country, euro_since: 2023-01-01}
      - input: ref('known_tax_table_issues')
        format: csv
        rows: |
          country_code,product,valid_from,valid_to,description
    expect:
      rows:
        - {country_code: HR, reported_excise: null, tax_tables_gap: null, vat_amount: 280.0}
  - name: known_tax_table_issues_explain_the_gap
    description: Uma semana dentro de um período já investigado leva a explicação; fora, não.
    model: fct_fuel_prices
    given:
      - input: ref('int_prices_pivoted')
        rows:
          - {week: 2022-12-26, country_code: NL, product: euro95, price_with_tax: 1000.0, price_without_tax: 600.0}
          - {week: 2024-01-01, country_code: NL, product: euro95, price_with_tax: 1000.0, price_without_tax: 600.0}
      - input: ref('int_taxes_in_force')
        rows:
          - {week: 2022-12-26, country_code: NL, product: euro95, vat_rate: 25, excise: 192.0, other_taxes: 0}
          - {week: 2024-01-01, country_code: NL, product: euro95, vat_rate: 25, excise: 192.0, other_taxes: 8.0}
      - input: ref('countries')
        rows:
          - {country_code: NL, name: Países Baixos, kind: country, euro_since: 2002-01-01}
      - input: ref('known_tax_table_issues')
        rows:
          - {country_code: NL, product: euro95, valid_from: 2011-01-01, valid_to: 2022-12-31, description: taxa em falta}
    expect:
      rows:
        - {week: 2022-12-26, tax_tables_gap: 8.0, tax_tables_issue: taxa em falta}
        - {week: 2024-01-01, tax_tables_gap: 0.0, tax_tables_issue: null}
  - name: forecast_uses_the_two_previous_weeks
    description: >
      Cotações de 850, 900 e 1000 € nas três semanas antes de 19/10: a previsão é
      0,5 × 100 + 0,2 × 50 = 60 € por 1000 L sem impostos, 0,075 € por litro com 25 % de IVA. O
      boletim mostra uma subida de 50 € sem impostos e de 50 € com impostos.
    model: fct_price_forecasts
    given:
      - input: ref('int_market_weeks')
        rows:
          - {product: euro95, week: 2026-09-28, eur_per_1000l: 850.0, days: 5, last_day: 2026-10-02}
          - {product: euro95, week: 2026-10-05, eur_per_1000l: 900.0, days: 5, last_day: 2026-10-09}
          - {product: euro95, week: 2026-10-12, eur_per_1000l: 1000.0, days: 3, last_day: 2026-10-14}
      - input: ref('forecast_coefficients')
        rows:
          - {product: euro95, market_series: DGASNYH, beta_last_week: 0.5, beta_week_before: 0.2}
      - input: ref('fct_fuel_prices')
        rows:
          - {week: 2026-10-12, country_code: PT, product: euro95, price_with_tax: 1950.0, price_without_tax: 950.0, vat_rate: 25}
          - {week: 2026-10-19, country_code: PT, product: euro95, price_with_tax: 2000.0, price_without_tax: 1000.0, vat_rate: 25}
    expect:
      rows:
        - {target_week: 2026-10-19, product: euro95, predicted_change: 0.075, actual_change_before_tax: 0.0625, actual_change: 0.05, market_days_last_week: 3, is_known: true}
