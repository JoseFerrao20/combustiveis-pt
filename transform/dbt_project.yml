name: combustiveis
version: "0.1.0"
profile: combustiveis
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

flags:
  send_anonymous_usage_stats: false

models:
  combustiveis:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  combustiveis:
    countries:
      +column_types:
        country_code: varchar
        name: varchar
        kind: varchar
        euro_since: date
    dgeg_brand_segments:
      +column_types:
        brand: varchar
        segment: varchar
    dgeg_fuels:
      +column_types:
        fuel: varchar
        name: varchar
        wob_product: varchar
        in_dashboard: boolean
    known_source_errors:
      +column_types:
        country_code: varchar
        product: varchar
        week: date
        description: varchar
    known_tax_table_issues:
      +column_types:
        country_code: varchar
        product: varchar
        valid_from: date
        valid_to: date
        description: varchar
    forecast_coefficients:
      +column_types:
        product: varchar
        market_series: varchar
        beta_last_week: double
        beta_week_before: double
        trained_from: date
        trained_to: date
    products:
      +column_types:
        product: varchar
        name: varchar
        unit: varchar
        is_road_fuel: boolean

tests:
  combustiveis:
    +store_failures: true
